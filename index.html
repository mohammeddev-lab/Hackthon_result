<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة النتائج المتطورة</title>
    <link rel="stylesheet" href="./css/output.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        @keyframes score-pop-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .score-pop {
            animation: score-pop-animation 0.4s ease-in-out;
        }

        @keyframes card-enter-animation {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card-enter {
            animation: card-enter-animation 0.6s ease-out forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="container mx-auto p-4 md:p-8">
        <div class="text-center mb-12">
            <h1 class="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 mb-4 filter drop-shadow-sm">
                لوحة النتائج
            </h1>
            <div class="h-1 w-32 bg-gradient-to-r from-blue-500 to-purple-500 mx-auto rounded-full"></div>
        </div>

        <div id="cards-container" class="flex flex-wrap justify-center items-stretch gap-6 mb-16">

            <div class="team-card bg-white rounded-2xl shadow-lg hover:shadow-2xl p-6 w-full sm:w-64 flex flex-col justify-between transform transition-all duration-300 border border-gray-100 opacity-0" style="animation-delay: 100ms;">
                <div>
                    <div class="h-2 w-full bg-blue-500 rounded-full mb-4"></div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">قسم البرمجيات</h2>
                </div>
                <p class="score text-6xl font-black text-blue-600 text-center my-6" data-value="0">0</p>
                <div class="flex gap-2 items-center">
                    <input type="number" step="0.5" class="points-input w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-center font-bold text-lg focus:ring-2 focus:ring-blue-400 focus:outline-none transition" placeholder="0.0">
                    
                    <button class="subtract-points-btn bg-red-500 text-white p-2 rounded-lg hover:bg-red-600 transition shadow-md hover:shadow-lg active:scale-95" title="طرح">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4" />
                        </svg>
                    </button>

                    <button class="add-points-btn bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition shadow-md hover:shadow-lg active:scale-95" title="إضافة">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="team-card bg-white rounded-2xl shadow-lg hover:shadow-2xl p-6 w-full sm:w-64 flex flex-col justify-between transform transition-all duration-300 border border-gray-100 opacity-0" style="animation-delay: 200ms;">
                <div>
                    <div class="h-2 w-full bg-indigo-500 rounded-full mb-4"></div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">قسم الأمن السيبراني</h2>
                </div>
                <p class="score text-6xl font-black text-indigo-600 text-center my-6" data-value="0">0</p>
                <div class="flex gap-2 items-center">
                    <input type="number" step="0.5" class="points-input w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-center font-bold text-lg focus:ring-2 focus:ring-indigo-400 focus:outline-none transition" placeholder="0.0">
                    <button class="subtract-points-btn bg-red-500 text-white p-2 rounded-lg hover:bg-red-600 transition shadow-md hover:shadow-lg active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4" />
                        </svg>
                    </button>
                    <button class="add-points-btn bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-700 transition shadow-md hover:shadow-lg active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="team-card bg-white rounded-2xl shadow-lg hover:shadow-2xl p-6 w-full sm:w-64 flex flex-col justify-between transform transition-all duration-300 border border-gray-100 opacity-0" style="animation-delay: 300ms;">
                <div>
                    <div class="h-2 w-full bg-purple-500 rounded-full mb-4"></div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">علوم الحاسوب</h2>
                </div>
                <p class="score text-6xl font-black text-purple-600 text-center my-6" data-value="0">0</p>
                <div class="flex gap-2 items-center">
                    <input type="number" step="0.5" class="points-input w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-center font-bold text-lg focus:ring-2 focus:ring-purple-400 focus:outline-none transition" placeholder="0.0">
                    <button class="subtract-points-btn bg-red-500 text-white p-2 rounded-lg hover:bg-red-600 transition shadow-md hover:shadow-lg active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4" />
                        </svg>
                    </button>
                    <button class="add-points-btn bg-purple-600 text-white p-2 rounded-lg hover:bg-purple-700 transition shadow-md hover:shadow-lg active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="team-card bg-white rounded-2xl shadow-lg hover:shadow-2xl p-6 w-full sm:w-64 flex flex-col justify-between transform transition-all duration-300 border border-gray-100 opacity-0" style="animation-delay: 400ms;">
                <div>
                    <div class="h-2 w-full bg-teal-500 rounded-full mb-4"></div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">الذكاء الاصطناعي</h2>
                </div>
                <p class="score text-6xl font-black text-teal-600 text-center my-6" data-value="0">0</p>
                <div class="flex gap-2 items-center">
                    <input type="number" step="0.5" class="points-input w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-center font-bold text-lg focus:ring-2 focus:ring-teal-400 focus:outline-none transition" placeholder="0.0">
                    <button class="subtract-points-btn bg-red-500 text-white p-2 rounded-lg hover:bg-red-600 transition shadow-md hover:shadow-lg active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4" />
                        </svg>
                    </button>
                    <button class="add-points-btn bg-teal-600 text-white p-2 rounded-lg hover:bg-teal-700 transition shadow-md hover:shadow-lg active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="team-card bg-white rounded-2xl shadow-lg hover:shadow-2xl p-6 w-full sm:w-64 flex flex-col justify-between transform transition-all duration-300 border border-gray-100 opacity-0" style="animation-delay: 500ms;">
                <div>
                    <div class="h-2 w-full bg-rose-500 rounded-full mb-4"></div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">قسم الشبكات</h2>
                </div>
                <p class="score text-6xl font-black text-rose-600 text-center my-6" data-value="0">0</p>
                <div class="flex gap-2 items-center">
                    <input type="number" step="0.5" class="points-input w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-center font-bold text-lg focus:ring-2 focus:ring-rose-400 focus:outline-none transition" placeholder="0.0">
                    <button class="subtract-points-btn bg-red-500 text-white p-2 rounded-lg hover:bg-red-600 transition shadow-md hover:shadow-lg active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 12H4" />
                        </svg>
                    </button>
                    <button class="add-points-btn bg-rose-600 text-white p-2 rounded-lg hover:bg-rose-700 transition shadow-md hover:shadow-lg active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>
                </div>
            </div>

        </div>

        <div class="text-center">
            <button id="show-results-btn" class="group relative px-8 py-4 bg-gray-900 text-white font-bold text-xl rounded-full shadow-2xl hover:bg-gray-800 transition-all duration-300 hover:scale-105 overflow-hidden">
                <span class="relative z-10">إعلان النتائج النهائية 🏆</span>
                <div class="absolute inset-0 h-full w-full bg-gradient-to-r from-yellow-400 to-yellow-600 opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
            </button>
        </div>
        
        <div id="results-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
            <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" id="modal-overlay"></div>
            
            <div class="glass-effect p-8 rounded-3xl shadow-2xl w-full max-w-lg relative transform scale-95 transition-all duration-300 max-h-[90vh] overflow-y-auto">
                <button id="close-modal-btn" class="absolute top-4 left-4 text-gray-400 hover:text-red-500 transition-colors p-2 bg-gray-100 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
                
                <h2 class="text-3xl font-black mb-8 text-center text-gray-800 border-b pb-4">🎉 النتائج النهائية 🎉</h2>
                
                <div id="final-scores" class="space-y-4">
                    </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addButtons = document.querySelectorAll('.add-points-btn');
            const subtractButtons = document.querySelectorAll('.subtract-points-btn');
            const showResultsBtn = document.getElementById('show-results-btn');
            const modal = document.getElementById('results-modal');
            const modalContent = modal.querySelector('.glass-effect');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const overlay = document.getElementById('modal-overlay');
            const finalScoresContainer = document.getElementById('final-scores');
            const teamCards = document.querySelectorAll('.team-card');

            // Trigger card entrance animation
            teamCards.forEach(card => {
                card.classList.add('card-enter');
            });

            // دالة مساعدة لتحديث النتيجة
            const updateScore = (scoreElement, newScore) => {
                // منع القيم السالبة
                if (newScore < 0) newScore = 0;

                // تحديث النص والـ Data Attribute
                scoreElement.textContent = Number.isInteger(newScore) ? newScore : newScore.toFixed(1);
                scoreElement.setAttribute('data-value', newScore);

                // تشغيل الأنيميشن
                scoreElement.classList.add('score-pop');
                setTimeout(() => {
                    scoreElement.classList.remove('score-pop');
                }, 400);
            };

            // معالج حدث زر الإضافة
            addButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const card = button.closest('.team-card');
                    const scoreElement = card.querySelector('.score');
                    const inputElement = card.querySelector('.points-input');
                    const points = parseFloat(inputElement.value);

                    if (!isNaN(points) && points !== 0) {
                        let currentScore = parseFloat(scoreElement.getAttribute('data-value'));
                        updateScore(scoreElement, currentScore + points);
                        inputElement.value = ''; // تفريغ الحقل
                    }
                });
            });

            // معالج حدث زر الطرح
            subtractButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const card = button.closest('.team-card');
                    const scoreElement = card.querySelector('.score');
                    const inputElement = card.querySelector('.points-input');
                    const points = parseFloat(inputElement.value);

                    if (!isNaN(points) && points !== 0) {
                        let currentScore = parseFloat(scoreElement.getAttribute('data-value'));
                        updateScore(scoreElement, currentScore - points); // طرح القيمة
                        inputElement.value = ''; // تفريغ الحقل
                    }
                });
            });

            const showModal = () => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            };

            const hideModal = () => {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modalContent.classList.add('scale-95');
                modalContent.classList.remove('scale-100');
            };

            // منطق عرض النتائج النهائية
            showResultsBtn.addEventListener('click', () => {
                const teamsData = Array.from(teamCards).map((card, i) => ({
                    name: card.querySelector('h2').textContent,
                    score: parseFloat(card.querySelector('.score').getAttribute('data-value'))
                }));

                // ترتيب تنازلي
                teamsData.sort((a, b) => b.score - a.score);
                finalScoresContainer.innerHTML = '';
                
                // تعريف الأنماط للمراكز الثلاثة الأولى
                const rankDetails = [
                    { rankText: 'المركز الأول', bg: 'bg-yellow-50', border: 'border-yellow-400', text: 'text-yellow-600', icon: '🥇' },
                    { rankText: 'المركز الثاني', bg: 'bg-gray-50', border: 'border-gray-300', text: 'text-gray-600', icon: '🥈' },
                    { rankText: 'المركز الثالث', bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-600', icon: '🥉' },
                ];

                teamsData.forEach((team, index) => {
                    // نمط افتراضي للمراكز البقية
                    let details = {
                        rankText: `المركز ${index + 1}`,
                        bg: 'bg-white',
                        border: 'border-gray-100',
                        text: 'text-gray-500',
                        icon: `<span class="text-sm font-bold bg-gray-100 w-8 h-8 flex items-center justify-center rounded-full">#${index + 1}</span>`
                    };

                    if (index < 3) {
                        details = {
                            ...rankDetails[index],
                            icon: `<span class="text-3xl">${rankDetails[index].icon}</span>`
                        };
                    }

                    const displayScore = Number.isInteger(team.score) ? team.score : team.score.toFixed(1);

                    const scoreCard = `
                        <div class="flex items-center justify-between p-4 rounded-xl border-2 ${details.border} ${details.bg} transform transition hover:scale-[1.02] shadow-sm">
                            <div class="flex items-center gap-4">
                                <div class="flex-shrink-0">
                                    ${details.icon}
                                </div>
                                <div class="text-right">
                                    <p class="text-xs font-bold ${details.text} mb-1">${details.rankText}</p>
                                    <h3 class="text-lg font-bold text-gray-800">${team.name}</h3>
                                </div>
                            </div>
                            <div class="text-xl font-black ${details.text}">
                                ${displayScore} <span class="text-xs font-medium text-gray-400">نقطة</span>
                            </div>
                        </div>
                    `;
                    finalScoresContainer.innerHTML += scoreCard;
                });
                
                showModal();
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, zIndex: 60 });
            });

            closeModalBtn.addEventListener('click', hideModal);
            overlay.addEventListener('click', hideModal);
        });
    </script>
</body>
</html>
